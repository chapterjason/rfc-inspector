name: CI

on:
    push:
        branches: [master]
        paths:
            - "**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - ".github/workflows/**"
    pull_request:
        branches: ["**"]
        paths:
            - "**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - ".github/workflows/**"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_OPTIONS: --enable-source-maps
    CI: true

jobs:
    lib:
        name: Library (@rfc-inspector/lib)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --workspace @rfc-inspector/lib

            - name: Typecheck
              run: npm run typecheck --workspace @rfc-inspector/lib

            - name: Build
              run: npm run build --workspace @rfc-inspector/lib

    bin:
        name: CLI (@rfc-inspector/bin)
        runs-on: ubuntu-latest
        needs: lib
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --workspace @rfc-inspector/bin

            - name: Build library dependency
              run: npm run build --workspace @rfc-inspector/lib

            - name: Typecheck
              run: npm run typecheck --workspace @rfc-inspector/bin

            - name: Build
              run: npm run build --workspace @rfc-inspector/bin

    browser:
        name: Browser (@rfc-inspector/browser)
        runs-on: ubuntu-latest
        needs: lib
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint --workspace @rfc-inspector/browser

            - name: Build library dependency
              run: npm run build --workspace @rfc-inspector/lib

            - name: Typecheck
              run: npm run typecheck --workspace @rfc-inspector/browser

            - name: Build
              run: npm run build --workspace @rfc-inspector/browser
