name: CI

on:
    push:
        branches: [ master ]
        paths:
            - "**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - ".github/workflows/**"
    pull_request:
        branches: [ "**" ]
        paths:
            - "**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig.json"
            - ".github/workflows/**"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_OPTIONS: --enable-source-maps
    CI: true

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                workspace:
                    - "@rfc-inspector/common"
                    - "@rfc-inspector/heuristic"
                    - "@rfc-inspector/tokenizer"
                    - "@rfc-inspector/lexer"
                    - "@rfc-inspector/parser"
                    - "@rfc-inspector/bin"
                    - "@rfc-inspector/browser"
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Lint
                run: npm run lint --workspace ${{ matrix.workspace }}

            -   name: Typecheck
                run: npm run typecheck --workspace ${{ matrix.workspace }}

            -   name: Build
                run: npm run build --workspace ${{ matrix.workspace }}
